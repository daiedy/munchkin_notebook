name: munchkin_notebook1
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=2.19.5 <3.0.0"

dependencies:
  auto_route: ^6.3.0
  cupertino_icons: ^1.0.2
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.5
  fluttertoast: ^8.2.2
  intl: any
  pinput: ^2.2.31

dev_dependencies:
  auto_route_generator: ^6.2.0
  build_runner: ^2.3.3
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Academy
      fonts:
        - asset: assets/fonts/academy.ttf
    - family: Munchkin
      fonts:
        - asset: assets/fonts/munchkin.ttf
  assets:
    - assets/images/